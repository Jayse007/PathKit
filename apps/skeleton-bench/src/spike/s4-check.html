<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPIKE S4 check page (not part of the app)</title>
    <style>
      body { font-family: system-ui, Segoe UI, Arial, sans-serif; margin: 12px; }
      #stage { width: 720px; height: 450px; border: 1px solid #444; position: relative; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #cross { position: absolute; inset: 0; pointer-events: none; }
      #controls { margin: 8px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      #readout { white-space: pre; font-family: Consolas, monospace; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>SPIKE S4: view offset check</h1>
    <p>
      Offset (fx, fy) is a fraction of the viewport. Designed sign: positive fx moves the picture right,
      positive fy moves it down. Cross-hairs mark the screen centre and do not move.
    </p>
    <div id="stage"></div>
    <div id="controls">
      <button id="left">Offset left (fx -0.1)</button>
      <button id="right">Offset right (fx +0.1)</button>
      <button id="up">Offset up (fy -0.1)</button>
      <button id="down">Offset down (fy +0.1)</button>
      <button id="reset">Reset offset</button>
      <label>Orbit angle <input id="angle" type="range" min="0" max="359" step="1" value="30" /></label>
      <label>Zoom <input id="zoom" type="range" min="0" max="1" step="0.01" value="0.25" /></label>
    </div>
    <div id="readout"></div>
    <script type="module" src="./s4-check.ts"></script>
  </body>
</html>
