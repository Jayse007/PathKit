<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shot Rail</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #stage {
        width: min(100vw, calc((100vh - 48px) * 16 / 9));
        aspect-ratio: 16 / 9;
        background: #20242a;
      }
      #timeline {
        box-sizing: border-box;
        width: min(100vw, calc((100vh - 48px) * 16 / 9));
        padding: 8px 12px;
      }
      #bar {
        padding: 8px 12px;
      }
      #overview {
        width: 240px;
        height: 240px;
        background: #20242a;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="timeline" role="group" aria-label="Timeline: play, pause, scrub and frame counter"></div>
      <div id="bar">
        <label for="lens">Lens</label>
        <select id="lens" title="Focal length of the main camera"></select>
        <span id="guides"></span>
        <span id="status" role="status"></span>
      </div>
      <div id="overview" title="Stage overview: top-down view of the car, road, cameras and rails"></div>
      <div id="grid" role="group" aria-label="Coverage grid: one tile per camera. Choose a tile to make it the main camera."></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
